[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dune-bayes"
version = "0.1.0.dev0"
description = "DUNE (Distributional Uncertainty in Neural-additive Estimation) — Bayesian additive models for location, scale, and shape with mean-field VI"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12",
    "numpy",
    "pandas>=2.2",
    "arviz",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pandas-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dune_bayes"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
