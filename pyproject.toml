[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dune-bayes"
version = "0.1.0.dev0"
description = "DUNE (Distributional Uncertainty in Neural-additive Estimation) — Bayesian additive models for location, scale, and shape with mean-field VI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.12",
    "numpy>=2",
    "pandas>=2.2",
    "arviz>=1.1",
    # Explicit, not transitive (issue #93): family CDFs for PIT calibration
    # go through scipy.stats (torch's StudentT has no .cdf).
    "scipy>=1.14",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyyaml>=6.0",
    "ruff",
    "mypy",
    "pandas-stubs",
    "scipy-stubs",
]
experiments = [
    "jax>=0.7",
    "numpyro>=0.19",
    "pyyaml>=6.0",
    "ucimlrepo>=0.0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dune_bayes"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hmc and not experiment'"
markers = [
    "experiment: opt-in full paper experiments and harness tests excluded from the core suite",
    "full_experiment: manual full canonical reruns excluded from bounded audits",
    "hmc: opt-in NumPyro/NUTS validation tests requiring experiment dependencies",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# Type hints on all public signatures, mechanized (CLAUDE.md tooling rule).
[[tool.mypy.overrides]]
module = "dune_bayes.*"
disallow_untyped_defs = true

# arviz ships no py.typed marker; its returns are handled at our call sites.
[[tool.mypy.overrides]]
module = "arviz.*"
ignore_missing_imports = true
