version: 1
manuscript: docs/manuscript/dune-bayes-paper.md
comparator_scope_decision: docs/manuscript/comparator-scope-decision.md
evidence_manifest: experiments/publication/evidence-manifest.yaml
claims:
  - id: central-disentanglement
    paper_claim: >
      DUNE separates epistemic uncertainty over learned shape functions from
      aleatoric uncertainty in the response family, and the law-of-total-
      variance decomposition makes the split measurable at response level.
    evidence:
      - evidence_class: simulation
        promoted_artifact: experiments/disentanglement/results/canonical
    intended_outputs:
      - figures/central-disentanglement__disentanglement.pdf
    limitation_note: >
      The dense/noisy versus sparse/quiet contrast is a synthetic stress test
      for the uncertainty-disentanglement mechanism, not real-data benchmark
      evidence.

  - id: per-feature-per-parameter-epistemic-bands
    paper_claim: >
      BayesianNAMLSS yields per-feature, per-parameter epistemic credible bands
      across the core distributional families used in the paper simulations.
    evidence:
      - evidence_class: simulation
        promoted_artifact: experiments/parameter_recovery/results/canonical-normal
      - evidence_class: simulation
        promoted_artifact: experiments/parameter_recovery/results/canonical-student-t
      - evidence_class: simulation
        promoted_artifact: experiments/parameter_recovery/results/canonical-gamma
      - evidence_class: simulation
        promoted_artifact: experiments/jsu_showcase/results/canonical
    intended_outputs:
      - figures/per-feature-per-parameter-epistemic-bands__canonical-normal__recovery.pdf
      - figures/per-feature-per-parameter-epistemic-bands__canonical-student-t__recovery.pdf
      - figures/per-feature-per-parameter-epistemic-bands__canonical-gamma__recovery.pdf
      - figures/per-feature-per-parameter-epistemic-bands__effect_ribbons.pdf
      - tables/per-feature-per-parameter-epistemic-bands__canonical-normal__calibration.csv
      - tables/per-feature-per-parameter-epistemic-bands__canonical-student-t__calibration.csv
      - tables/per-feature-per-parameter-epistemic-bands__canonical-gamma__calibration.csv
      - tables/per-feature-per-parameter-epistemic-bands__coverage.csv
    limitation_note: >
      Coverage is measured rather than asserted; centered effect recovery and
      separate intercept coverage are required because additive shape functions
      are identifiable only up to level.

  - id: vi-vs-nuts-limitation
    paper_claim: >
      Mean-field VI limitations are quantified against validation-only NUTS so
      narrowness and under-coverage are visible rather than hidden.
    evidence:
      - evidence_class: validation
        promoted_artifact: experiments/hmc_agreement/results/canonical
    intended_outputs:
      - figures/vi-vs-nuts-limitation__vi_vs_nuts.pdf
      - tables/vi-vs-nuts-limitation__parameter_intervals.csv
      - tables/vi-vs-nuts-limitation__band_width_ratios.csv
    limitation_note: >
      NUTS is an experiments-only validation comparator behind the deferred
      JAX/NumPyro seam; dune-bayes does not ship an MCMC backend in v1.

  - id: benchmark-comparator-panel
    paper_claim: >
      Real-data UCI results characterize DUNE against the promoted canonical
      panel of dune-bayes, BayesNAM-style, plain MLP, and deep ensemble
      comparators; optional external NAMLSS, LA-NAM, and BAMLSS/R comparators
      remain documented exclusions, and the paper does not claim universal
      predictive dominance.
    evidence:
      - evidence_class: real_data_benchmark
        promoted_artifact: experiments/uci_benchmark/results/canonical
    intended_outputs:
      - tables/benchmark-comparator-panel__comparison.csv
      - tables/benchmark-comparator-panel__autompg__nll.csv
      - tables/benchmark-comparator-panel__autompg__crps.csv
      - tables/benchmark-comparator-panel__autompg__calibration.csv
      - tables/benchmark-comparator-panel__autompg__variance_split.csv
    limitation_note: >
      Benchmark evidence is empirical characterization and comparator context.
      The UCI panel remains characterization evidence unless promoted results
      are later expanded and re-gated to support a stronger predictive claim.
