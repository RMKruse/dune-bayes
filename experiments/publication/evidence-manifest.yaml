version: 1
claims:
  - id: central-disentanglement
    family: disentanglement
    statement: >
      The law-of-total-variance decomposition separates epistemic effect
      uncertainty from aleatoric family uncertainty in the synthetic dense/noisy
      versus sparse/quiet setting.
    requires: full
    evidence:
      path: experiments/disentanglement/results/canonical
      artifact_class: simulation
      expected_files:
        - config.yaml
        - run.json
        - arrays/decomposition.npz
        - metrics/regional_components.json
        - figures/disentanglement.pdf
      file_hashes:
        config.yaml: 4f8f6c71a0805bbca7485d85d4c181b0279a353cc518ef6086514380f952463f
        run.json: be93d2fc4eb5a8ed282f6e8daf27da574b4044673d78a99d0872abd1b9db0645
        metrics/regional_components.json: 7120553740b5ad35ffe162ef9718a2894b61e486f1fe485d22486f764719887e
      provenance:
        experiment: disentanglement
        seed: 9901

